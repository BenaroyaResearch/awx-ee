      # - name: Scan image in a private registry
      #   uses: aquasecurity/trivy-action@0.29.0
      #   with:
      #     image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'
      #     scan-type: image
